<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="title desc">
  <title id="title">One Reveille core, three places to run</title>
  <desc id="desc">The Reveille core holds shared connections, the tool catalogue, wake and sleep, and the front door. It depends on a source for the server list and a runtime to start and stop servers. On a laptop servers are local processes defined in a folder of YAML files. Under Docker Compose they are sibling containers started through the Docker socket. On Kubernetes they are MCPServer resources run as Deployments scaled between zero and one, installed with a Helm chart or kustomize.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 20px; font-weight: 700; fill: #3730a3; }
    .card-title { font-size: 16px; font-weight: 700; }
    .label { font-size: 12px; fill: #6b7280; }
    .value { font-size: 14px; }
    .chip { font-size: 12px; fill: #374151; }
    .seam { font-size: 13px; font-weight: 600; fill: #3730a3; }
    .detail { font-size: 13px; fill: #4b5563; }
  </style>

  <rect width="960" height="430" fill="#ffffff"/>

  <!-- Core -->
  <rect x="250" y="20" width="460" height="140" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text class="title" x="480" y="52" text-anchor="middle">Reveille core</text>
  <text class="detail" x="480" y="77" text-anchor="middle">shared connections · tool catalogue · wake and sleep · front door</text>
  <rect x="272" y="98" width="200" height="40" rx="20" fill="#ffffff" stroke="#c7d2fe"/>
  <text class="seam" x="372" y="123" text-anchor="middle">Source: the server list</text>
  <rect x="488" y="98" width="200" height="40" rx="20" fill="#ffffff" stroke="#c7d2fe"/>
  <text class="seam" x="588" y="123" text-anchor="middle">Runtime: start and stop</text>

  <!-- Connectors -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.5">
    <path d="M480,160 L480,192"/>
    <path d="M180,192 L780,192"/>
    <path d="M180,192 L180,226" marker-end="url(#arrow)"/>
    <path d="M480,192 L480,226" marker-end="url(#arrow)"/>
    <path d="M780,192 L780,226" marker-end="url(#arrow)"/>
  </g>

  <!-- Laptop -->
  <rect x="40" y="230" width="280" height="180" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="card-title" x="60" y="262">On a laptop</text>
  <text class="label" x="60" y="290">Servers are defined in</text>
  <text class="value" x="60" y="309">a folder of YAML files</text>
  <text class="label" x="60" y="336">Servers run as</text>
  <text class="value" x="60" y="355">local processes</text>
  <rect x="60" y="372" width="88" height="24" rx="12" fill="#f3f4f6"/>
  <text class="chip" x="104" y="388" text-anchor="middle">docker run</text>
  <rect x="156" y="372" width="48" height="24" rx="12" fill="#f3f4f6"/>
  <text class="chip" x="180" y="388" text-anchor="middle">uvx</text>
  <rect x="212" y="372" width="48" height="24" rx="12" fill="#f3f4f6"/>
  <text class="chip" x="236" y="388" text-anchor="middle">npx</text>

  <!-- Docker Compose -->
  <rect x="340" y="230" width="280" height="180" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="card-title" x="360" y="262">Docker Compose</text>
  <text class="label" x="360" y="290">Servers are defined in</text>
  <text class="value" x="360" y="309">a mounted folder of YAML files</text>
  <text class="label" x="360" y="336">Servers run as</text>
  <text class="value" x="360" y="355">sibling containers, on demand</text>
  <rect x="360" y="372" width="160" height="24" rx="12" fill="#f3f4f6"/>
  <text class="chip" x="440" y="388" text-anchor="middle">through the Docker socket</text>

  <!-- Kubernetes -->
  <rect x="640" y="230" width="280" height="180" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="card-title" x="660" y="262">Kubernetes</text>
  <text class="label" x="660" y="290">Servers are defined in</text>
  <text class="value" x="660" y="309">MCPServer resources</text>
  <text class="label" x="660" y="336">Servers run as</text>
  <text class="value" x="660" y="355">Deployments scaled 0 ↔ 1</text>
  <rect x="660" y="372" width="84" height="24" rx="12" fill="#f3f4f6"/>
  <text class="chip" x="702" y="388" text-anchor="middle">Helm chart</text>
  <rect x="752" y="372" width="78" height="24" rx="12" fill="#f3f4f6"/>
  <text class="chip" x="791" y="388" text-anchor="middle">kustomize</text>
</svg>
