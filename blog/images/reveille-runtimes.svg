<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="title desc">
  <title id="title">One Reveille core, two places to run</title>
  <desc id="desc">The Reveille core holds shared connections, the tool catalogue, wake and sleep, and the front door. It depends on a source for the server list and a runtime to start and stop servers. On a laptop or server, the single binary reads a folder of YAML files and runs each server as a Docker container through the Docker Engine API, or as a local process. On Kubernetes they are MCPServer resources run as Deployments scaled between zero and one, installed with a Helm chart or kustomize.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 20px; font-weight: 700; fill: #3730a3; }
    .card-title { font-size: 16px; font-weight: 700; }
    .label { font-size: 12px; fill: #6b7280; }
    .value { font-size: 14px; }
    .chip { font-size: 12px; fill: #374151; }
    .seam { font-size: 13px; font-weight: 600; fill: #3730a3; }
    .detail { font-size: 13px; fill: #4b5563; }
  </style>

  <rect width="960" height="430" fill="#ffffff"/>

  <!-- Core -->
  <rect x="250" y="20" width="460" height="140" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text class="title" x="480" y="52" text-anchor="middle">Reveille core</text>
  <text class="detail" x="480" y="77" text-anchor="middle">shared connections · tool catalogue · wake and sleep · front door</text>
  <rect x="272" y="98" width="200" height="40" rx="20" fill="#ffffff" stroke="#c7d2fe"/>
  <text class="seam" x="372" y="123" text-anchor="middle">Source: the server list</text>
  <rect x="488" y="98" width="200" height="40" rx="20" fill="#ffffff" stroke="#c7d2fe"/>
  <text class="seam" x="588" y="123" text-anchor="middle">Runtime: start and stop</text>

  <!-- Connectors -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.5">
    <path d="M480,160 L480,192"/>
    <path d="M280,192 L680,192"/>
    <path d="M280,192 L280,226" marker-end="url(#arrow)"/>
    <path d="M680,192 L680,226" marker-end="url(#arrow)"/>
  </g>

  <!-- Laptop or server -->
  <rect x="100" y="230" width="360" height="180" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="card-title" x="120" y="262">On a laptop or server: one binary</text>
  <text class="label" x="120" y="290">Servers are defined in</text>
  <text class="value" x="120" y="309">a folder of YAML files</text>
  <text class="label" x="120" y="336">Servers run as</text>
  <text class="value" x="120" y="355">Docker containers or local processes</text>
  <rect x="120" y="372" width="136" height="24" rx="12" fill="#f3f4f6"/>
  <text class="chip" x="188" y="388" text-anchor="middle">Docker Engine API</text>
  <rect x="264" y="372" width="48" height="24" rx="12" fill="#f3f4f6"/>
  <text class="chip" x="288" y="388" text-anchor="middle">uvx</text>
  <rect x="320" y="372" width="48" height="24" rx="12" fill="#f3f4f6"/>
  <text class="chip" x="344" y="388" text-anchor="middle">npx</text>

  <!-- Kubernetes -->
  <rect x="500" y="230" width="360" height="180" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="card-title" x="520" y="262">Kubernetes</text>
  <text class="label" x="520" y="290">Servers are defined in</text>
  <text class="value" x="520" y="309">MCPServer resources</text>
  <text class="label" x="520" y="336">Servers run as</text>
  <text class="value" x="520" y="355">Deployments scaled 0 ↔ 1</text>
  <rect x="520" y="372" width="84" height="24" rx="12" fill="#f3f4f6"/>
  <text class="chip" x="562" y="388" text-anchor="middle">Helm chart</text>
  <rect x="612" y="372" width="78" height="24" rx="12" fill="#f3f4f6"/>
  <text class="chip" x="651" y="388" text-anchor="middle">kustomize</text>
</svg>
